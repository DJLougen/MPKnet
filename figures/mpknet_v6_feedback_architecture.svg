<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263241" />
    </marker>
    <marker id="fbArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b83280" />
    </marker>
    <style>
      .title{font:700 42px Arial, Helvetica, sans-serif; fill:#101828}
      .subtitle{font:23px Arial, Helvetica, sans-serif; fill:#475467}
      .section{font:700 28px Arial, Helvetica, sans-serif; fill:#101828}
      .label{font:700 24px Arial, Helvetica, sans-serif; fill:#101828}
      .body{font:20px Arial, Helvetica, sans-serif; fill:#344054}
      .small{font:18px Arial, Helvetica, sans-serif; fill:#667085}
      .box{rx:18; ry:18; stroke-width:3}
      .mainArrow{stroke:#263241; stroke-width:5; fill:none; marker-end:url(#arrow)}
      .fbArrow{stroke:#b83280; stroke-width:5; fill:none; marker-end:url(#fbArrow)}
      .dash{stroke-dasharray:10 8}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="80" y="72" class="title">MPKNet V6 Feedback Architecture</text>
  <text x="80" y="112" class="subtitle">Feedforward M/P/K vision with explicit V1-to-LGN corticogeniculate gain feedback.</text>

  <!-- Feedforward row -->
  <text x="80" y="185" class="section">Feedforward sensory drive</text>

  <rect class="box" x="80" y="220" width="190" height="130" fill="#dbeafe" stroke="#2563eb"/>
  <text x="110" y="265" class="label">Image</text>
  <text x="110" y="300" class="body">RGB input</text>
  <text x="110" y="328" class="body">224 x 224</text>

  <rect class="box" x="345" y="205" width="240" height="160" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="375" y="250" class="label">Retina</text>
  <text x="375" y="285" class="body">center-surround</text>
  <text x="375" y="313" class="body">M/P split</text>
  <text x="375" y="341" class="body">left/right views</text>

  <rect class="box" x="680" y="155" width="225" height="110" fill="#dcfce7" stroke="#16a34a"/>
  <text x="710" y="197" class="label">LGN P</text>
  <text x="710" y="230" class="body">fine detail, color</text>
  <rect class="box" x="680" y="300" width="225" height="110" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="710" y="342" class="label">LGN K</text>
  <text x="710" y="375" class="body">context gates</text>
  <rect class="box" x="680" y="445" width="225" height="110" fill="#fee2e2" stroke="#dc2626"/>
  <text x="710" y="487" class="label">LGN M</text>
  <text x="710" y="520" class="body">global gist</text>

  <rect class="box" x="1015" y="245" width="250" height="175" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1045" y="292" class="label">V1</text>
  <text x="1045" y="327" class="body">M/P fusion</text>
  <text x="1045" y="355" class="body">K-gated modulation</text>
  <text x="1045" y="383" class="body">cortical state</text>

  <rect class="box" x="1360" y="265" width="170" height="135" fill="#f1f5f9" stroke="#475467"/>
  <text x="1390" y="310" class="label">Head</text>
  <text x="1390" y="345" class="body">pool</text>
  <text x="1390" y="373" class="body">classify</text>

  <path class="mainArrow" d="M270 285 L345 285"/>
  <path class="mainArrow" d="M585 285 C620 245 635 210 680 210"/>
  <path class="mainArrow" d="M585 285 L680 355"/>
  <path class="mainArrow" d="M585 285 C620 385 635 500 680 500"/>
  <path class="mainArrow" d="M905 210 C955 220 975 275 1015 300"/>
  <path class="mainArrow" d="M905 355 L1015 335"/>
  <path class="mainArrow" d="M905 500 C955 490 975 390 1015 365"/>
  <path class="mainArrow" d="M1265 332 L1360 332"/>

  <!-- Feedback row -->
  <text x="80" y="675" class="section">Feedback refinement</text>

  <rect class="box" x="345" y="715" width="330" height="145" fill="#ffffff" stroke="#94a3b8"/>
  <text x="375" y="760" class="label">First V1 context</text>
  <text x="375" y="795" class="body">global pooled cortical state</text>
  <text x="375" y="823" class="body">summarizes scene structure</text>

  <rect class="box" x="760" y="700" width="350" height="175" fill="#fae8ff" stroke="#b83280"/>
  <text x="790" y="745" class="label">V1 -> LGN feedback</text>
  <text x="790" y="780" class="body">learned gain control</text>
  <text x="790" y="808" class="body">modulates M/P streams</text>
  <text x="790" y="836" class="body">does not reconstruct pixels</text>

  <rect class="box" x="1195" y="715" width="300" height="145" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1225" y="760" class="label">Refined V1</text>
  <text x="1225" y="795" class="body">second cortical pass</text>
  <text x="1225" y="823" class="body">classification readout</text>

  <path class="fbArrow" d="M1140 420 C1105 580 705 610 510 715"/>
  <path class="fbArrow" d="M675 787 L760 787"/>
  <path class="fbArrow" d="M1110 787 L1195 787"/>
  <path class="fbArrow dash" d="M935 700 C900 610 860 570 792 555"/>
  <path class="fbArrow dash" d="M935 700 C900 635 855 625 792 265"/>

  <text x="855" y="612" class="small">feedback gates LGN M/P gain</text>
  <text x="1185" y="462" class="small">feedforward path remains intact</text>

  <!-- Compact legend -->
  <rect class="box" x="80" y="760" width="205" height="125" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="803" class="label">Legend</text>
  <line x1="105" y1="832" x2="160" y2="832" class="mainArrow" marker-end="none"/>
  <text x="175" y="839" class="small">feedforward</text>
  <line x1="105" y1="862" x2="160" y2="862" class="fbArrow" marker-end="none"/>
  <text x="175" y="869" class="small">feedback</text>
</svg>
